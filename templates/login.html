<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — LMPC Compliance Scanner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="card login-card p-4 shadow">
    <div class="text-center mb-3">
      <i class="fa-solid fa-scale-balanced fa-2x" style="color:#13315c;"></i>
      <h4 class="mt-2 mb-0">LMPC Compliance Scanner</h4>
      <small class="text-muted">Legal Metrology (Packaged Commodities) Rules, 2011</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
    <p class="text-muted text-center mt-3 mb-0" style="font-size:0.8rem;">
      Default: admin / admin123 (first run)
    </p>
  </div>
</div>
</body>
</html>
